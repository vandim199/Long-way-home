<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Way Home prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a felt game mat; every space is a die-cut cardboard token with a hard ink shadow, home at the center of a 5×5 board. */
:root {
  --mat: #15302e;
  --mat-2: #1d3f3c;
  --mat-line: #2c5652;
  --token: #f1e6c8;
  --token-dim: #c9bd9e;
  --ink: #1a1712;
  --text: #e8efe9;
  --muted: #9db8b2;
  --gold: #f2b632;
  --fire: #ff6a3d;
  --monster: #9b6ff0;
  --bad: #ff7a6b;
  --good: #8fdc7a;
  --font-display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 30%, var(--mat-2), var(--mat) 70%);
  background-color: var(--mat);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px; }

/* top bar */
.top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0; line-height: 1; white-space: nowrap; font-variation-settings: 'opsz' 96; }
.brand span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,.22); border: 1px solid var(--mat-line); border-radius: 8px; padding: 3px 7px; }
.stat small { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat b { font-family: var(--font-display); font-size: 15px; line-height: 1.1; }
.stat.low { border-color: var(--bad); color: var(--bad); }
.help-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--mat-line); background: transparent; font-weight: 700; }

/* hud cards */
.hud { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; }
.card { background: rgba(0,0,0,.24); border: 1px solid var(--mat-line); border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--muted); }
.card.threat.fire::before { background: var(--fire); }
.card.threat.monsters::before { background: var(--monster); }
.card.meal::before { background: var(--good); }
.card.meal.short::before { background: var(--bad); }
.card.meal.short .card-line:last-child { color: var(--bad); }
.card-head { display: flex; align-items: center; gap: 6px; }
.big-ico { font-size: 18px; line-height: 1; }
.card-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; flex: 1; }
.hp { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.hp s { color: var(--muted); font-size: 14px; font-weight: 600; }
.card-line { font-size: 11.5px; color: var(--muted); }
.card-line.strong { color: var(--text); }
.bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i, .bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width .35s ease; }
.bar i { background: rgba(255,255,255,.22); }
.threat.fire .bar b { background: var(--fire); }
.threat.monsters .bar b { background: var(--monster); }

/* resources */
.res { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chip { display: flex; align-items: baseline; justify-content: center; gap: 3px; background: var(--token); color: var(--ink); border: 2px solid var(--ink); border-radius: 9px; box-shadow: 0 2px 0 var(--ink); padding: 4px 2px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.chip .ri { font-size: 14px; }
.chip .rv { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.chip .rout { font-size: 10.5px; font-weight: 700; color: #b5381f; }
.chip .rin { font-size: 10.5px; font-weight: 700; color: #2f7a1f; }

/* board */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--gold); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 7px 9px; font-size: 13px; }
.banner[hidden] { display: none; }
.banner button { background: var(--ink); color: var(--token); border: 0; border-radius: 7px; padding: 5px 10px; font-weight: 700; }
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border-radius: 16px; background: rgba(0,0,0,.18); border: 1px dashed var(--mat-line); }
.cell { position: relative; aspect-ratio: 1; }
.tile { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 11px; padding: 4px 4px 3px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; overflow: hidden; }
.tile.empty { border: 1.5px dashed rgba(255,255,255,.07); background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.07) 0 2px, transparent 3px); }
button.tile { background: var(--token); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease; }
button.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tile.convert { background: #e5dcf0; }
.tname { font-family: var(--font-display); font-weight: 700; font-size: 10px; line-height: 1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbig { display: flex; align-items: center; justify-content: center; gap: 1px; line-height: 1; }
.tbig b { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.tbig i { font-style: normal; font-size: 14px; }
.tbig em { font-style: normal; font-size: 11px; margin: 0 1px; }
.tbig small { font-size: 10px; font-weight: 700; margin-left: 2px; }
.tfoot { display: flex; align-items: center; justify-content: space-between; gap: 2px; min-height: 14px; }
.travel { font-size: 10px; font-weight: 700; background: rgba(26,23,18,.1); border-radius: 6px; padding: 0 3px; line-height: 14px; font-variant-numeric: tabular-nums; }
.ext { font-size: 9px; letter-spacing: -1px; }
.tile.foe { color: #fff; }
.tile.foe.fire { background: linear-gradient(160deg, #ffb03d, var(--fire) 60%, #c8341a); }
.tile.foe.monsters { background: linear-gradient(160deg, #c3a2ff, var(--monster) 60%, #5a33a8); }
.tile.foe .tbig i, .tile.foe .tbig { font-size: 15px; }
.tile.foe .travel { background: rgba(0,0,0,.25); }
.tile.foe { animation: throb 2.4s ease-in-out infinite; }
@keyframes throb { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 14px 2px rgba(255,140,80,.55); } }
.tile.foe.monsters { animation-name: throb-m; }
@keyframes throb-m { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 14px 2px rgba(170,130,255,.55); } }
.tile.home { background: var(--gold); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 50%; align-items: center; justify-content: center; gap: 1px; padding: 4px; }
.tile.home .tname { font-size: 9px; }
.home-ico { font-size: 18px; line-height: 1; }
.home-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; max-width: 90%; }
.home-dots .dot { width: 11px; height: 11px; font-size: 7px; border-width: 1px; }
.tile.locked { background: repeating-linear-gradient(135deg, var(--token-dim) 0 6px, #bdb08f 6px 12px); }
.tile.locked .tbig, .tile.locked .tname { opacity: .45; }
.lock { position: absolute; left: 3px; right: 3px; bottom: 3px; display: flex; align-items: center; gap: 3px; background: var(--ink); color: var(--token); border-radius: 6px; padding: 1px 3px; font-size: 9.5px; font-weight: 700; line-height: 14px; }
.tile.planned { outline: 3px solid var(--wc); outline-offset: -1px; }
.plan { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; padding: 3px; pointer-events: none; }
.plan > .dot { margin-left: -4px; }
.plan { flex-wrap: wrap; }
.pv { align-self: stretch; text-align: center; background: var(--wc); color: var(--ink); border-radius: 6px; font-size: 10.5px; font-weight: 700; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1.5px solid var(--ink); }
.tile.targetable { outline: 3px dashed var(--gold); outline-offset: 2px; animation: pick 1s ease-in-out infinite; }
@keyframes pick { 50% { transform: translateY(-2px); } }
.dot { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--wc); border: 1.5px solid var(--ink); color: var(--ink); font-size: 9px; font-weight: 700; flex: none; font-family: var(--font-body); }
.dot.ghost { opacity: .35; }
.dot.mini { width: 12px; height: 12px; font-size: 7px; }
.float { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); z-index: 5; pointer-events: none; white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 5px; animation: rise 1.3s ease-out forwards; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -26px); } }

/* crew */
.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.worker { display: flex; align-items: center; gap: 6px; text-align: left; background: rgba(0,0,0,.25); border: 2px solid var(--mat-line); border-radius: 10px; padding: 5px 7px; min-height: 44px; }
.worker .dot { width: 22px; height: 22px; font-size: 11px; }
.wtext { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.wname { font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1.1; }
.wstat { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wside { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.mods { font-size: 11px; letter-spacing: -1px; min-height: 12px; }
.eat { font-size: 10px; color: var(--muted); white-space: nowrap; }
.worker.sel { border-color: var(--wc); background: rgba(255,255,255,.08); box-shadow: 0 0 0 1px var(--wc) inset; }
.worker.sel .wstat { color: var(--text); }
.worker.planned { border-style: dashed; border-color: var(--wc); }
.worker.away { opacity: .55; }
.worker.targetable { border: 2px dashed var(--gold); animation: pick 1s ease-in-out infinite; opacity: 1; }

/* footer */
.foot { display: flex; flex-direction: column; gap: 8px; }
#endTurn { width: 100%; background: var(--gold); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); padding: 11px; font-family: var(--font-display); font-weight: 800; font-size: 18px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
#endTurn small { font-family: var(--font-body); font-weight: 400; font-size: 11.5px; }
#endTurn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#endTurn:disabled { opacity: .5; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; min-height: 18px; }
.log li::before { content: '› '; color: var(--gold); }

/* overlay */
.overlay { position: fixed; inset: 0; background: rgba(10,22,21,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 12px; }
.overlay[hidden] { display: none; }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow: auto; background: var(--token); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0; line-height: 1.05; text-wrap: balance; letter-spacing: -.02em; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6b5d3c; }
.sum { margin: 0; padding-left: 16px; font-size: 13px; }
.purse { font-size: 14px; }
.purse b { font-family: var(--font-display); font-size: 17px; }
.offers { display: flex; flex-direction: column; gap: 8px; }
.offer { display: flex; align-items: center; gap: 10px; background: #fff8e6; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; }
.offer.sold { opacity: .45; }
.oi { font-size: 24px; }
.ot { flex: 1; display: flex; flex-direction: column; font-size: 12.5px; }
.ot b { font-family: var(--font-display); font-size: 15px; }
.ot em { font-style: normal; font-size: 11px; color: #6b5d3c; margin-top: 2px; }
.offer button, .sheet-actions button { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; font-weight: 700; background: var(--gold); box-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
.offer button:disabled, .sheet-actions button:disabled { opacity: .45; box-shadow: none; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-actions .ghost { background: transparent; }
.sheet-actions .go { background: var(--ink); color: var(--token); }
.next { margin: 0; font-size: 12.5px; color: #6b5d3c; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.end.loss h2 { color: #a3301b; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); background: var(--ink); color: var(--token); border: 2px solid var(--gold); border-radius: 10px; padding: 8px 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 370px) {
  .tname { font-size: 8.5px; }
  .tbig b { font-size: 18px; }
  .hud { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div class="brand"><h1>Long Way Home</h1><span>Prototype</span></div>
    <button class="help-btn" data-act="help" aria-label="How to play">?</button>
    <div class="stats">
      <div class="stat"><small>Season</small><b id="season">1/8</b></div>
      <div class="stat"><small>Turn</small><b id="turn">1/8</b></div>
      <div class="stat" id="heartsBox"><small>Hearts ❤</small><b id="hearts">5</b></div>
      <div class="stat"><small>Coins 🪙</small><b id="coins">2</b></div>
    </div>
  </header>
  <section class="hud" aria-label="Threat and meal">
    <div class="card threat" id="threat"></div>
    <div class="card meal" id="meal"></div>
  </section>
  <section class="res" id="res" aria-label="Your store"></section>
  <div class="banner" id="banner" hidden></div>
  <section class="board" id="board" aria-label="Board"></section>
  <section class="crew" id="crew" aria-label="Villagers"></section>
  <footer class="foot">
    <button id="endTurn" data-act="end">End turn</button>
    <ul class="log" id="log" aria-live="polite"></ul>
  </footer>
</main>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script>
// ===== Long Way Home — game logic (no DOM) =====
const CFG = {
  seasons: 8,
  turns: 8,
  mealTurn: 4,
  startHearts: 5,
  maxHearts: 5,
  carry: 3,
  start: { wheat: 2, bread: 3, water: 1, wood: 1, arrows: 0, coins: 2 },
  threatHp: s => 5 + 2 * (s - 1),
  threatGrowth: s => 1 + Math.floor((s - 1) / 3),
  bounty: (s, unused) => 3 + s + unused,
};

const RES = ['wheat', 'bread', 'water', 'wood', 'arrows'];
const ICON = { wheat: '🌾', bread: '🍞', water: '💧', wood: '🪵', arrows: '🏹', coins: '🪙' };

const TYPES = {
  field:    { name: 'Field',    icon: '🌾', kind: 'gather',  res: 'wheat',  base: 2 },
  well:     { name: 'Well',     icon: '🪣', kind: 'gather',  res: 'water',  base: 2 },
  forest:   { name: 'Forest',   icon: '🌲', kind: 'gather',  res: 'wood',   base: 2 },
  mine:     { name: 'Mine',     icon: '⛏️', kind: 'gather',  res: 'coins',  base: 1 },
  bakery:   { name: 'Bakery',   icon: '🥖', kind: 'convert', from: 'wheat', to: 'bread',  ratio: 1, verb: 'bake' },
  fletcher: { name: 'Fletcher', icon: '🪚', kind: 'convert', from: 'wood',  to: 'arrows', ratio: 1, verb: 'make arrows' },
};

const THREATS = {
  fire:     { name: 'Fire',     icon: '🔥', res: 'water',  per: 1, done: 'put out' },
  monsters: { name: 'Monsters', icon: '👹', res: 'arrows', per: 2, done: 'driven off' },
};

const MODS = {
  swift:   { name: 'Swift',   icon: '👟', text: 'Travels 1 turn faster (never below 1).', price: 5 },
  strong:  { name: 'Strong',  icon: '💪', text: 'Carries 3 more when baking, fletching or fighting.', price: 4 },
  forager: { name: 'Forager', icon: '🧺', text: '+2 every time they gather.', price: 5 },
  golden:  { name: 'Golden',  icon: '✨', text: '+1 🪙 every time they act.', price: 6 },
  brave:   { name: 'Brave',   icon: '🛡️', text: '+2 damage when fighting, even empty-handed.', price: 4 },
  hearty:  { name: 'Hearty',  icon: '🍖', text: 'Eats 1 less 🍞 at meals.', price: 4 },
};

const UPGRADES = {
  worker:   { name: 'New villager', icon: '🧑', text: '+1 worker. Eats 1 🍞 at every meal.', target: null },
  road:     { name: 'Road',         icon: '🛤️', text: 'One space: travel time −1 (never below 1).', target: 'space', price: 4 },
  fertile:  { name: 'Fertile',      icon: '🌱', text: 'One gathering space grows +1 more each turn.', target: 'space', price: 4 },
  tools:    { name: 'Better tools', icon: '⚒️', text: 'Bakery or Fletcher: +1 output per input.', target: 'space', price: 5 },
  festival: { name: 'Festival',     icon: '🎉', text: '+2 ❤ (up to 5).', target: null, price: 3 },
};

const NAMES = ['Ada', 'Bram', 'Cora', 'Dov', 'Esme', 'Finn', 'Greta', 'Hal', 'Ines', 'Jory', 'Kit', 'Lena', 'Milo', 'Nell', 'Otto', 'Pia', 'Rosa', 'Sven', 'Tova', 'Wren'];
const COLORS = ['#f2a93b', '#5bb8ea', '#ef6f8c', '#8ccf6a', '#b994ec', '#f08a4b', '#46c9ad', '#e4d04a'];

let S = null;

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const dist = c => Math.abs(c.x - 2) + Math.abs(c.y - 2);
function cellsAt(d) { const out = []; for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) if (dist({ x, y }) === d) out.push({ x, y }); return out; }

// ----- derived values -----
const cnt = (w, m) => w.mods.filter(x => x === m).length;
const appetite = w => Math.max(0, 1 + Math.max(0, w.mods.length - 1) - cnt(w, 'hearty'));
const carry = w => CFG.carry + 3 * cnt(w, 'strong');
const totalAppetite = () => S.workers.reduce((a, w) => a + appetite(w), 0);
const growth = sp => 1 + sp.fert;
const ratio = sp => TYPES[sp.type].ratio + sp.tools;
const gatherBase = sp => TYPES[sp.type].base + (sp.dist - 1);
const gatherAmt = (sp, w) => gatherBase(sp) + sp.pile + (w ? 2 * cnt(w, 'forager') : 0);
const travelOf = (t, w) => Math.max(1, t.dist - (t.road || 0) - (w ? cnt(w, 'swift') : 0));
const W = id => S.workers.find(w => w.id === id);
const target = id => (id === 'T' ? S.threat : S.spaces.find(s => s.id === id));
const planOf = wid => S.plans.find(p => p.wid === wid);
const isFree = w => w.away === 0 && !planOf(w.id);
const freeWorkers = () => S.workers.filter(isFree);
const avail = r => S.res[r] - S.plans.reduce((a, p) => a + (p.cost[r] || 0), 0);
const incoming = r => S.plans.reduce((a, p) => a + (p.gain[r] || 0), 0);
const plannedDmg = () => S.plans.reduce((a, p) => a + (p.dmg || 0), 0);
const nextMealIsMid = () => S.turn <= CFG.mealTurn;
function upgradePrice(id) {
  if (id === 'worker') return 7 + 4 * S.bought.worker;
  if (MODS[id]) return MODS[id].price;
  return UPGRADES[id].price;
}
function offerDef(id) {
  if (MODS[id]) return { ...MODS[id], target: 'worker', mod: true };
  return UPGRADES[id];
}

// ----- setup -----
function addWorker() {
  const used = new Set(S.workers.map(w => w.name));
  const name = S.namePool.find(n => !used.has(n)) || ('V' + S.nextId);
  const w = { id: 'w' + (S.nextId++), name, color: COLORS[S.workers.length % COLORS.length], mods: [], away: 0, at: null, fresh: false };
  S.workers.push(w);
  return w;
}

function layout() {
  const chosen = [...shuffle(cellsAt(1)).slice(0, 3), ...shuffle(cellsAt(2)).slice(0, 3), ...shuffle(cellsAt(3)).slice(0, 2)];
  const types = ['field', 'field', 'well', 'forest', 'bakery', 'fletcher', 'mine', pick(['field', 'well', 'forest'])];
  for (let tries = 0; tries < 500; tries++) {
    shuffle(types);
    const ok = chosen.every((c, i) => {
      const d = dist(c), t = types[i];
      if ((t === 'bakery' || t === 'fletcher') && d === 3) return false;
      if (t === 'mine' && d === 1) return false;
      return true;
    });
    if (ok) break;
  }
  S.spaces = chosen.map((c, i) => ({ id: 's' + i, type: types[i], x: c.x, y: c.y, dist: dist(c), road: 0, fert: 0, tools: 0, pile: 1, lockedBy: null }));
}

function newThreat() {
  const taken = new Set(S.spaces.map(s => s.x + ',' + s.y));
  const free = [...cellsAt(2), ...cellsAt(3)].filter(c => !taken.has(c.x + ',' + c.y));
  const c = pick(free);
  const type = S.nextThreat;
  S.threat = { id: 'T', isThreat: true, type, x: c.x, y: c.y, dist: dist(c), hp: CFG.threatHp(S.season), max: CFG.threatHp(S.season), growth: CFG.threatGrowth(S.season) };
  S.nextThreat = type === 'fire' ? 'monsters' : 'fire';
}

function newRun() {
  S = {
    season: 1, turn: 1, hearts: CFG.startHearts, res: { ...CFG.start }, workers: [], spaces: [], threat: null,
    plans: [], phase: 'play', selected: null, log: ['Tap a villager, then a space. Press End turn to collect.'],
    shop: null, pending: null, bought: { worker: 0 }, nextId: 1, namePool: shuffle([...NAMES]),
    nextThreat: pick(['fire', 'monsters']), over: null, stats: { turns: 0 },
  };
  for (let i = 0; i < 3; i++) addWorker();
  layout();
  newThreat();
  autoSelect();
}

function autoSelect() {
  const cur = S.selected && W(S.selected);
  if (cur && isFree(cur)) return;
  const f = freeWorkers()[0];
  S.selected = f ? f.id : null;
}

// ----- planning -----
function preview(w, t) {
  const gain = {}, cost = {};
  let dmg = 0;
  if (t.isThreat) {
    const r = THREATS[t.type].res;
    const amount = Math.min(carry(w), avail(r));
    dmg = amount * THREATS[t.type].per + 2 * cnt(w, 'brave');
    if (dmg <= 0) return { ok: false, why: `You have no ${ICON[r]} to fight the ${THREATS[t.type].name.toLowerCase()} with.` };
    if (amount) cost[r] = amount;
  } else {
    const T = TYPES[t.type];
    if (T.kind === 'gather') {
      gain[T.res] = gatherAmt(t, w);
    } else {
      const amount = Math.min(carry(w), avail(T.from));
      if (!amount) return { ok: false, why: `You need ${ICON[T.from]} in stock to ${T.verb}. Gather it first.` };
      cost[T.from] = amount;
      gain[T.to] = amount * ratio(t);
    }
  }
  const g = cnt(w, 'golden');
  if (g) gain.coins = (gain.coins || 0) + g;
  return { ok: true, gain, cost, dmg, travel: travelOf(t, w) };
}

function assign(wid, tid) {
  if (S.phase !== 'play') return { ok: false };
  const w = W(wid), t = target(tid);
  if (!w || !t) return { ok: false };
  if (!isFree(w)) return { ok: false, why: `${w.name} isn't home.` };
  if (!t.isThreat) {
    if (t.lockedBy) { const o = W(t.lockedBy); return { ok: false, why: `${o ? o.name : 'Someone'} is still walking back from here.` }; }
    if (S.plans.some(p => p.tid === tid)) return { ok: false, why: 'Someone is already going there this turn.' };
  }
  const pv = preview(w, t);
  if (!pv.ok) return pv;
  S.plans.push({ wid, tid, ...pv });
  S.selected = null;
  autoSelect();
  return { ok: true };
}

function unassign(wid) {
  S.plans = S.plans.filter(p => p.wid !== wid);
  S.selected = wid;
}

// ----- resolution -----
function meal(log, label) {
  const need = totalAppetite();
  const eat = Math.min(need, S.res.bread);
  S.res.bread -= eat;
  const short = need - eat;
  S.hearts -= short;
  log.push(short ? `${label}: ate ${eat}🍞, ${short} short. −${short}❤.` : `${label}: everyone ate (${eat}🍞).`);
}

function fmtGain(p) {
  const parts = [];
  if (p.dmg) parts.push('−' + p.dmg + (S.threat ? THREATS[S.threat.type].icon : ''));
  for (const r in p.gain) parts.push('+' + p.gain[r] + ICON[r]);
  return parts.join(' ');
}

function endTurn() {
  if (S.phase !== 'play') return null;
  const report = { fx: [], log: [] };
  let fought = false;
  const before = S.threat.hp;
  const got = {};
  for (const p of S.plans) {
    const w = W(p.wid), t = target(p.tid);
    for (const r in p.cost) S.res[r] -= p.cost[r];
    for (const r in p.gain) { S.res[r] += p.gain[r]; got[r] = (got[r] || 0) + p.gain[r]; }
    if (t.isThreat) { S.threat.hp = Math.max(0, S.threat.hp - p.dmg); fought = true; }
    else {
      if (TYPES[t.type].kind === 'gather') t.pile = 0;
      t.lockedBy = w.id;
    }
    w.away = p.travel; w.at = p.tid; w.fresh = true;
    report.fx.push({ tid: p.tid, text: fmtGain(p) });
  }
  const gotTxt = Object.keys(got).map(r => `+${got[r]}${ICON[r]}`).join(' ');
  if (gotTxt) report.log.push('Collected ' + gotTxt + '.');
  S.plans = [];

  // travel home
  for (const w of S.workers) {
    if (w.away > 0 && !w.fresh) {
      w.away--;
      if (w.away === 0) {
        const sp = w.at === 'T' ? null : target(w.at);
        if (sp && sp.lockedBy === w.id) sp.lockedBy = null;
        w.at = null;
      }
    }
    w.fresh = false;
  }
  // accumulation
  for (const sp of S.spaces) if (!sp.lockedBy && TYPES[sp.type].kind === 'gather') sp.pile += growth(sp);

  const T = THREATS[S.threat.type];
  if (fought) report.log.push(`${T.name} ${before} → ${S.threat.hp}.`);
  S.stats.turns++;
  S.log = report.log;
  if (S.threat.hp <= 0) { finishSeason(report); return report; }
  if (!fought) { S.threat.hp += S.threat.growth; report.log.push(`${T.name} grew to ${S.threat.hp}.`); }

  if (S.turn === CFG.mealTurn) meal(report.log, 'Meal');
  if (S.hearts <= 0) { lose('Your village went hungry.'); return report; }
  if (S.turn >= CFG.turns) {
    lose(S.threat.type === 'fire' ? 'The fire burned through the village.' : 'The monsters overran the village.');
    return report;
  }
  S.turn++;
  autoSelect();
  S.log = report.log;
  return report;
}

function recallAll() {
  for (const w of S.workers) { w.away = 0; w.at = null; w.fresh = false; }
  for (const sp of S.spaces) sp.lockedBy = null;
  S.plans = [];
}

function finishSeason(report) {
  const T = THREATS[S.threat.type];
  meal(report.log, 'Season-end meal');
  recallAll();
  if (S.hearts <= 0) { lose('Your village went hungry.'); return; }
  const unused = CFG.turns - S.turn;
  const b = CFG.bounty(S.season, unused);
  S.res.coins += b;
  report.log.unshift(`${T.name} ${T.done} on turn ${S.turn}. Bounty +${b}🪙.`);
  S.log = report.log;
  if (S.season >= CFG.seasons) { S.phase = 'won'; S.over = { win: true, why: `You survived all ${CFG.seasons} seasons.` }; return; }
  S.phase = 'shop';
  S.shop = { offers: rollOffers(), reroll: 2, summary: report.log.slice() };
}

function lose(why) {
  S.phase = 'lost';
  S.over = { win: false, why };
  recallAll();
}

// ----- shop -----
function rollOffers() {
  let pool = ['worker', 'worker', ...Object.keys(MODS), 'road', 'fertile', 'tools', 'festival'];
  if (S.hearts >= CFG.maxHearts) pool = pool.filter(x => x !== 'festival');
  const out = [];
  while (out.length < 3 && pool.length) {
    const id = pick(pool);
    pool = pool.filter(x => x !== id);
    out.push({ id, sold: false });
  }
  return out;
}

function reroll() {
  if (S.phase !== 'shop' || S.res.coins < S.shop.reroll) return false;
  S.res.coins -= S.shop.reroll;
  S.shop.reroll++;
  S.shop.offers = rollOffers();
  return true;
}

function validTarget(id, obj) {
  const d = offerDef(id);
  if (d.target === 'worker') return !!obj && !obj.isThreat && !!obj.mods;
  if (d.target === 'space') {
    if (!obj || obj.isThreat || obj.mods) return false;
    const kind = TYPES[obj.type].kind;
    if (id === 'road') return obj.dist - obj.road > 1;
    if (id === 'fertile') return kind === 'gather';
    if (id === 'tools') return kind === 'convert';
  }
  return false;
}

function buy(i) {
  if (S.phase !== 'shop') return { ok: false };
  const o = S.shop.offers[i];
  if (!o || o.sold) return { ok: false };
  const price = upgradePrice(o.id);
  if (S.res.coins < price) return { ok: false, why: `Costs ${price}🪙. You have ${S.res.coins}.` };
  const d = offerDef(o.id);
  if (!d.target) {
    S.res.coins -= price;
    o.sold = true;
    if (o.id === 'worker') { S.bought.worker++; addWorker(); }
    if (o.id === 'festival') S.hearts = Math.min(CFG.maxHearts, S.hearts + 2);
    return { ok: true };
  }
  S.phase = 'target';
  S.pending = { i, id: o.id };
  return { ok: true, targeting: true };
}

function applyTarget(objId) {
  if (S.phase !== 'target') return { ok: false };
  const { i, id } = S.pending;
  const obj = W(objId) || target(objId);
  if (!validTarget(id, obj)) return { ok: false, why: 'That can’t take this upgrade.' };
  const price = upgradePrice(id);
  S.res.coins -= price;
  S.shop.offers[i].sold = true;
  if (MODS[id]) obj.mods.push(id);
  if (id === 'road') obj.road++;
  if (id === 'fertile') obj.fert++;
  if (id === 'tools') obj.tools++;
  S.phase = 'shop';
  S.pending = null;
  return { ok: true };
}

function cancelTarget() { if (S.phase === 'target') { S.phase = 'shop'; S.pending = null; } }

function nextSeason() {
  if (S.phase !== 'shop') return;
  S.season++;
  S.turn = 1;
  newThreat();
  S.phase = 'play';
  S.shop = null;
  S.log = [`Season ${S.season}: ${THREATS[S.threat.type].icon} ${THREATS[S.threat.type].name} at strength ${S.threat.hp}, growing +${S.threat.growth} each turn you don't fight.`];
  S.selected = null;
  autoSelect();
}


// ===== Long Way Home — UI =====
const $ = s => document.querySelector(s);
let pendingFx = [];
let toastTimer = null;
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function dot(w, extra = '') {
  return `<span class="dot ${extra}" style="--wc:${w.color}">${esc(w.name[0])}</span>`;
}

function render() {
  renderTop();
  renderHud();
  renderRes();
  renderBoard();
  renderCrew();
  renderFoot();
  renderOverlay();
}

function renderTop() {
  $('#season').textContent = `${S.season}/${CFG.seasons}`;
  $('#turn').textContent = `${S.turn}/${CFG.turns}`;
  $('#hearts').textContent = S.hearts;
  $('#coins').textContent = S.res.coins;
  $('#heartsBox').classList.toggle('low', S.hearts <= 2);
}

function renderHud() {
  const t = S.threat, T = THREATS[t.type];
  const dmg = plannedDmg();
  const after = Math.max(0, t.hp - dmg);
  const left = CFG.turns - S.turn;
  const pct = Math.min(100, Math.round((t.hp / Math.max(t.max, t.hp)) * 100));
  const afterPct = Math.min(100, Math.round((after / Math.max(t.max, t.hp)) * 100));
  $('#threat').className = 'card threat ' + t.type;
  $('#threat').innerHTML = `
    <div class="card-head"><span class="big-ico">${T.icon}</span><span class="card-title">${T.name}</span>
      <span class="hp">${dmg ? `<s>${t.hp}</s> ${after}` : t.hp}</span></div>
    <div class="bar"><i style="width:${pct}%"></i><b style="width:${afterPct}%"></b></div>
    <div class="card-line">Needs ${ICON[T.res]}${T.per > 1 ? ` (each deals ${T.per})` : ''} · grows +${t.growth} on turns you don't fight it</div>
    <div class="card-line strong">${left === 0 ? 'Last turn to stop it!' : `Stop it by the end of turn ${CFG.turns} · ${left + 1} turns left`}</div>`;

  const need = totalAppetite();
  const have = S.res.bread, inc = incoming('bread'), out = S.plans.reduce((a, p) => a + (p.cost.bread || 0), 0);
  const proj = have + inc - out;
  const when = S.turn < CFG.mealTurn ? `after turn ${CFG.mealTurn}` : S.turn === CFG.mealTurn ? 'after this turn' : 'at season end';
  const short = proj < need;
  $('#meal').className = 'card meal' + (short ? ' short' : '');
  $('#meal').innerHTML = `
    <div class="card-head"><span class="big-ico">🍽️</span><span class="card-title">Meal</span><span class="hp">${need}🍞</span></div>
    <div class="card-line strong">${when}</div>
    <div class="card-line">${short ? `Short by ${need - proj}. Each missing 🍞 costs 1 ❤.` : `Covered: ${proj}🍞 after this turn.`}</div>`;
}

function renderRes() {
  $('#res').innerHTML = RES.map(r => {
    const inc = incoming(r), out = S.res[r] - avail(r);
    return `<div class="chip"><span class="ri">${ICON[r]}</span><span class="rv">${S.res[r]}</span>${out ? `<span class="rout">−${out}</span>` : ''}${inc ? `<span class="rin">+${inc}</span>` : ''}</div>`;
  }).join('');
}

function tileHTML(x, y) {
  if (x === 2 && y === 2) {
    const home = S.workers.filter(w => w.away === 0);
    return `<div class="tile home" aria-label="Home"><span class="tname">Home</span><span class="home-ico">🏠</span><span class="home-dots">${home.map(w => dot(w, planOf(w.id) ? 'ghost' : '')).join('')}</span></div>`;
  }
  const sp = S.spaces.find(s => s.x === x && s.y === y);
  const isT = S.threat && S.threat.x === x && S.threat.y === y;
  if (!sp && !isT) return `<div class="tile empty" aria-hidden="true"></div>`;
  const t = isT ? S.threat : sp;
  const sel = S.selected && W(S.selected);
  const plans = S.plans.filter(p => p.tid === t.id);
  const targetable = S.phase === 'target' && validTarget(S.pending.id, t);
  let cls = 'tile', body = '';
  const travel = travelOf(t, sel || null);
  if (isT) {
    const T = THREATS[t.type];
    cls += ' foe ' + t.type;
    const comingBack = S.workers.filter(w => w.at === 'T' && w.away > 0);
    body = `<span class="tname">${T.name}</span><span class="tbig">${T.icon}<b>${t.hp}</b></span>
      <span class="tfoot"><span class="travel">👣${travel}</span>${comingBack.map(w => dot(w, 'mini')).join('')}</span>`;
  } else {
    const ty = TYPES[sp.type];
    cls += ' ' + ty.kind;
    let mid;
    if (ty.kind === 'gather') mid = `<b>${gatherAmt(sp, sel || null)}</b><i>${ICON[ty.res]}</i>`;
    else mid = `<i>${ICON[ty.from]}</i><em>→</em><i>${ICON[ty.to]}</i>${ratio(sp) > 1 ? `<small>×${ratio(sp)}</small>` : ''}`;
    const extras = (sp.fert ? '🌱' : '') + (sp.road ? '🛤️' : '') + (sp.tools ? '⚒️' : '');
    body = `<span class="tname">${ty.name}</span><span class="tbig">${mid}</span>
      <span class="tfoot"><span class="travel">👣${travel}</span><span class="ext">${extras}</span></span>`;
    if (sp.lockedBy) {
      const w = W(sp.lockedBy);
      cls += ' locked';
      body += `<span class="lock">${dot(w)}<span>back in ${w.away}</span></span>`;
    }
  }
  if (plans.length) {
    cls += ' planned';
    const w = W(plans[0].wid);
    body += `<span class="plan" style="--wc:${w.color}">${plans.map(p => dot(W(p.wid))).join('')}<span class="pv">${esc(plans.map(p => fmtGain(p)).join(' '))}</span></span>`;
  }
  if (targetable) cls += ' targetable';
  return `<button class="${cls}" data-act="tile" data-id="${t.id}" style="${plans.length ? `--wc:${W(plans[0].wid).color}` : ''}">${body}</button>`;
}

function renderBoard() {
  let h = '';
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) h += `<div class="cell" data-x="${x}" data-y="${y}">${tileHTML(x, y)}</div>`;
  $('#board').innerHTML = h;
  if (pendingFx.length && !reduceMotion()) {
    for (const f of pendingFx) {
      const t = target(f.tid) || (f.tid === 'T' && S.threat);
      if (!t) continue;
      const cell = $(`#board .cell[data-x="${t.x}"][data-y="${t.y}"]`);
      if (!cell) continue;
      const s = document.createElement('span');
      s.className = 'float';
      s.textContent = f.text;
      cell.appendChild(s);
    }
  }
  pendingFx = [];
  const banner = $('#banner');
  if (S.phase === 'target') {
    const d = offerDef(S.pending.id);
    banner.hidden = false;
    banner.innerHTML = `<span>${d.icon} <b>${esc(d.name)}</b> (${upgradePrice(S.pending.id)}🪙): tap ${d.target === 'worker' ? 'a villager' : 'a highlighted space'}</span><button data-act="cancel">Cancel</button>`;
  } else banner.hidden = true;
}

function renderCrew() {
  $('#crew').innerHTML = S.workers.map(w => {
    const p = planOf(w.id);
    let st, cls = 'worker';
    if (w.away > 0) { st = `Back in ${w.away}`; cls += ' away'; }
    else if (p) { const t = target(p.tid); st = `→ ${t.isThreat ? THREATS[t.type].name : TYPES[t.type].name}`; cls += ' planned'; }
    else st = 'Home';
    if (S.selected === w.id && S.phase === 'play') cls += ' sel';
    if (S.phase === 'target' && validTarget(S.pending.id, w)) cls += ' targetable';
    const mods = w.mods.map(m => `<span title="${MODS[m].name}">${MODS[m].icon}</span>`).join('');
    return `<button class="${cls}" data-act="worker" data-id="${w.id}" style="--wc:${w.color}">
      ${dot(w)}<span class="wtext"><span class="wname">${esc(w.name)}</span><span class="wstat">${st}</span></span>
      <span class="wside"><span class="mods">${mods}</span><span class="eat">eats ${appetite(w)}🍞</span></span></button>`;
  }).join('');
}

function renderFoot() {
  const free = freeWorkers().length, planned = S.plans.length;
  const btn = $('#endTurn');
  btn.disabled = S.phase !== 'play';
  btn.innerHTML = planned ? `End turn <small>${planned} sent${free ? `, ${free} still home` : ''}</small>` : free ? `End turn <small>nobody sent</small>` : `Wait <small>everyone is away</small>`;
  $('#log').innerHTML = (S.log || []).map(l => `<li>${esc(l)}</li>`).join('');
}

function offerCard(o, i) {
  const d = offerDef(o.id);
  const price = upgradePrice(o.id);
  const afford = S.res.coins >= price;
  return `<div class="offer ${o.sold ? 'sold' : ''}">
    <span class="oi">${d.icon}</span>
    <span class="ot"><b>${esc(d.name)}</b><span>${esc(d.text)}</span>${d.mod ? '<em>Stacks. Each modifier past the first adds +1 🍞 to that villager’s meals.</em>' : ''}</span>
    <button data-act="buy" data-i="${i}" ${o.sold || !afford ? 'disabled' : ''}>${o.sold ? 'Bought' : `${price}🪙`}</button></div>`;
}

function renderOverlay() {
  const ov = $('#overlay');
  if (S.phase === 'shop') {
    const nextT = THREATS[S.nextThreat];
    ov.hidden = false;
    ov.innerHTML = `<div class="sheet">
      <p class="eyebrow">Season ${S.season} cleared</p>
      <h2>Market</h2>
      <ul class="sum">${S.shop.summary.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
      <div class="purse">You have <b>${S.res.coins}🪙</b> · ❤ ${S.hearts}</div>
      <div class="offers">${S.shop.offers.map(offerCard).join('')}</div>
      <div class="sheet-actions">
        <button class="ghost" data-act="reroll" ${S.res.coins < S.shop.reroll ? 'disabled' : ''}>New offers · ${S.shop.reroll}🪙</button>
        <button class="go" data-act="next">Start season ${S.season + 1}</button>
      </div>
      <p class="next">Next up: ${nextT.icon} ${nextT.name}, strength ${CFG.threatHp(S.season + 1)}, grows +${CFG.threatGrowth(S.season + 1)}.</p>
    </div>`;
  } else if (S.phase === 'lost' || S.phase === 'won') {
    ov.hidden = false;
    ov.innerHTML = `<div class="sheet end ${S.over.win ? 'win' : 'loss'}">
      <p class="eyebrow">${S.over.win ? 'Victory' : 'Run over'}</p>
      <h2>${esc(S.over.why)}</h2>
      <p>Reached season ${S.season}, turn ${S.turn}, with ${S.workers.length} villagers.</p>
      <ul class="sum">${(S.log || []).map(l => `<li>${esc(l)}</li>`).join('')}</ul>
      <div class="sheet-actions"><button class="go" data-act="newrun">New run</button></div></div>`;
  } else if (helpOpen) {
    ov.hidden = false;
    ov.innerHTML = `<div class="sheet help">
      <h2>How to play</h2>
      <ul class="rules">
        <li><b>Send villagers.</b> Tap a villager, then a space. Send as many as you like, then press <b>End turn</b>. Everything pays out at the end of the turn.</li>
        <li><b>The long way home.</b> 👣 is how many turns the villager stays away. Until they're back, you can't use that villager <i>or</i> that space.</li>
        <li><b>Piles grow.</b> A gathering space grows +1 every turn nobody is using it. Far spaces start bigger.</li>
        <li><b>Converting needs stock.</b> The Bakery and Fletcher only use what's already in your store, not what's arriving this turn.</li>
        <li><b>Meals.</b> After turn ${CFG.mealTurn} and at season end, each villager eats 🍞. Each missing bread costs 1 ❤. At 0 ❤ the run ends.</li>
        <li><b>The threat.</b> Fight it by sending villagers with 💧 (fire) or 🏹 (monsters, 2 damage each). Each carries ${CFG.carry}. Any number can go at once. It grows on turns you don't fight it. Stop it by turn ${CFG.turns} or the run ends.</li>
        <li><b>Market.</b> Stopping it early pays more 🪙. Spend coins between seasons on villagers, modifiers and space upgrades.</li>
      </ul>
      <div class="sheet-actions"><button class="go" data-act="closehelp">Got it</button></div></div>`;
  } else {
    ov.hidden = true;
    ov.innerHTML = '';
  }
}

let helpOpen = false;

function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'help') { helpOpen = true; return render(); }
  if (act === 'closehelp') { helpOpen = false; return render(); }
  if (act === 'newrun') { newRun(); helpOpen = false; return render(); }
  if (act === 'end') {
    const r = endTurn();
    if (r) pendingFx = r.fx;
    return render();
  }
  if (act === 'buy') { const r = buy(+el.dataset.i); if (!r.ok && r.why) toast(r.why); return render(); }
  if (act === 'reroll') { reroll(); return render(); }
  if (act === 'next') { nextSeason(); return render(); }
  if (act === 'cancel') { cancelTarget(); return render(); }
  if (S.phase === 'target') {
    if (act === 'worker' || act === 'tile') { const r = applyTarget(id); if (!r.ok && r.why) toast(r.why); return render(); }
    return;
  }
  if (S.phase !== 'play') return;
  if (act === 'worker') {
    const w = W(id);
    if (w.away > 0) { toast(`${w.name} is walking home: back in ${w.away} turn${w.away > 1 ? 's' : ''}.`); return; }
    if (planOf(id)) { unassign(id); return render(); }
    S.selected = id;
    return render();
  }
  if (act === 'tile') {
    const plansHere = S.plans.filter(p => p.tid === id);
    const sel = S.selected && W(S.selected);
    if (!sel || !isFree(sel)) {
      if (plansHere.length) { unassign(plansHere[plansHere.length - 1].wid); return render(); }
      toast(freeWorkers().length ? 'Pick a villager first.' : 'Everyone is busy. Press End turn.');
      return;
    }
    if (plansHere.length && id !== 'T') { unassign(plansHere[0].wid); return render(); }
    const r = assign(sel.id, id);
    if (!r.ok && r.why) toast(r.why);
    return render();
  }
}

function start(data) {
  if (data && data.S && data.S.workers && data.S.threat) S = data.S;
  else newRun();
  document.addEventListener('click', onClick);
  render();
}

try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

</script>
</body>
